<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t d">
  <title id="t">OTSR — optimal-transport Gaussian super-resolution in the browser</title>
  <desc id="d">The start screen of OTSR: the instrument with its rings waiting for an image, the wordmark, three claims (any resolution, on-device, no neural weights), the boot log reporting the GPU ready, and a strip of anisotropic Gaussians.</desc>
  <style>
  .sans { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',Helvetica,Arial,sans-serif; }
  .mono { font-family: ui-monospace,'Cascadia Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
  .spin { transform-origin: 300px 262px; animation: spin 90s linear infinite; }
  .spinr { transform-origin: 300px 262px; animation: spin 140s linear infinite reverse; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .d1 { animation: dot 1.6s steps(1) infinite; }
  .d2 { animation: dot 1.6s steps(1) .4s infinite; }
  .d3 { animation: dot 1.6s steps(1) .8s infinite; }
  .glow { animation: glow 2.6s ease-in-out infinite; }
  .star { animation: star 4s ease-in-out infinite; }
  .boot { animation: boot 11s steps(1) infinite; }
  .seg { animation: seg 11s steps(1) infinite; }
  .gauss { animation: grow 3.2s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes dot { 0%, 24% { opacity: 0; } 25%, 100% { opacity: 1; } }
  @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @keyframes star { 0%, 100% { opacity: .25; } 50% { opacity: .75; } }
  @keyframes grow { 0%, 100% { transform: scale(.55); opacity: .35; } 50% { transform: scale(1); opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .b0 { animation-delay: 0s; } @keyframes boot0 { 0%, 6% { opacity: 0; } 6.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: 0; } }
  .b0 { animation: boot0 11s linear infinite; }
  .b1 { animation-delay: 0s; } @keyframes boot1 { 0%, 13% { opacity: 0; } 13.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: 0; } }
  .b1 { animation: boot1 11s linear infinite; }
  .b2 { animation-delay: 0s; } @keyframes boot2 { 0%, 20% { opacity: 0; } 20.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: 0; } }
  .b2 { animation: boot2 11s linear infinite; }
  .b3 { animation-delay: 0s; } @keyframes boot3 { 0%, 27% { opacity: 0; } 27.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: 0; } }
  .b3 { animation: boot3 11s linear infinite; }
  .b4 { animation-delay: 0s; } @keyframes boot4 { 0%, 34% { opacity: 0; } 34.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: 0; } }
  .b4 { animation: boot4 11s linear infinite; }
  @keyframes seg0 { 0%, 40% { opacity: .25; } 40.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s0 { animation: seg0 11s linear infinite; }
  @keyframes seg1 { 0%, 44% { opacity: .25; } 44.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s1 { animation: seg1 11s linear infinite; }
  @keyframes seg2 { 0%, 48% { opacity: .25; } 48.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s2 { animation: seg2 11s linear infinite; }
  @keyframes seg3 { 0%, 52% { opacity: .25; } 52.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s3 { animation: seg3 11s linear infinite; }
  @keyframes seg4 { 0%, 56% { opacity: .25; } 56.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s4 { animation: seg4 11s linear infinite; }
  @keyframes seg5 { 0%, 60% { opacity: .25; } 60.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s5 { animation: seg5 11s linear infinite; }
  @keyframes seg6 { 0%, 64% { opacity: .25; } 64.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s6 { animation: seg6 11s linear infinite; }
  @keyframes seg7 { 0%, 68% { opacity: .25; } 68.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s7 { animation: seg7 11s linear infinite; }
  @keyframes seg8 { 0%, 72% { opacity: .25; } 72.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s8 { animation: seg8 11s linear infinite; }
  @keyframes seg9 { 0%, 76% { opacity: .25; } 76.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s9 { animation: seg9 11s linear infinite; }
  @keyframes seg10 { 0%, 80% { opacity: .25; } 80.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s10 { animation: seg10 11s linear infinite; }
  @keyframes seg11 { 0%, 84% { opacity: .25; } 84.01%, 94% { opacity: 1; } 94.01%, 100% { opacity: .25; } }
  .s11 { animation: seg11 11s linear infinite; }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.1" fill="rgba(20,22,20,0.16)"/></pattern>
    <pattern id="grid" width="110" height="110" patternUnits="userSpaceOnUse"><path d="M110 0 V110 M0 110 H110" stroke="#c7c8c0" stroke-width=".6" opacity=".5"/></pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
