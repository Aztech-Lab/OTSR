    <rect x="224" y="156" width="7" height="7" fill="#b8793c" class="blink"/>
    <text x="238" y="163" class="mono" font-size="11" letter-spacing="2.2" fill="#b8793c">INPUT DETECTING<tspan class="d1">.</tspan><tspan class="d2">.</tspan><tspan class="d3">.</tspan></text>
  </g>
